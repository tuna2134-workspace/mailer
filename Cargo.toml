[workspace]
resolver = "2"
members = [
    "crates/mail-domain",
    "crates/mail-application",
    "crates/mail-storage",
    "crates/mail-postgres",
    "crates/mail-migrations",
    "crates/mail-testkit",
    "crates/mail-admin-api",
    "crates/mail-admin-client",
    "crates/mail-tls",
    "crates/mail-acme",
    "crates/mail-smtp-proto",
    "crates/mail-smtp-server",
    "crates/mail-sasl",
    "crates/mail-dns",
    "crates/mail-smtp-client",
    "crates/mail-delivery",
    "crates/mail-address",
    "crates/mail-message",
    "crates/mail-mime",
    "crates/mail-mailbox",
    "crates/mail-imap-proto",
    "crates/mail-imap-server",
    "crates/mail-spf",
    "crates/mail-dkim",
    "crates/mail-dmarc",
    "crates/mail-arc",
    "crates/mail-dsn",
    "crates/mail-sieve",
    "crates/mail-policy",
    "crates/mail-list",
    "bins/mail-migrate",
    "bins/mailctl",
    "bins/maild",
    "bins/mail-queue-worker",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.91"
base64 = "0.22.1"
bytes = "1.12.1"
futures = "0.3.31"
hickory-resolver = { version = "0.25.2", features = ["system-config", "tokio"] }
quoted_printable = "0.5.2"
proptest = "1.11.0"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-rustls-acme = "0.9.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
ring = "0.17.14"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rcgen = "0.14.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
tempfile = "3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
