name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mailer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mailer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MAIL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mailer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal --component rustfmt,clippy
          rustup default 1.88
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check stable build
        run: cargo +stable test --workspace --no-run

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Assert vulnerable RSA is not in the resolved graph
        run: |
          if cargo tree --workspace --all-features --target all -i rsa@0.9.10 2>/dev/null | grep -q '^rsa '; then
            echo 'RUSTSEC-2023-0071 is reachable in the workspace dependency graph'
            exit 1
          fi
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88"
          command: check advisories bans licenses sources

  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build bounded parser fuzz harnesses
        run: cargo +stable check --manifest-path fuzz/Cargo.toml --bins

  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run SMTP and IMAP differential suite
        run: >-
          docker compose -f tests/differential/compose.yaml up --build
          --abort-on-container-exit --exit-code-from differential-runner
      - name: Upload differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-report
          path: target/differential/
          if-no-files-found: warn
      - name: Tear down differential environment
        if: always()
        run: docker compose -f tests/differential/compose.yaml down -v --remove-orphans
